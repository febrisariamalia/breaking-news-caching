events {
    worker_connections 1024;
}

http {
    # Dua instance app; instance yang gagal dilewati sementara oleh Nginx.
    upstream flask_backend {
        server app1:5000 max_fails=3 fail_timeout=10s;
        server app2:5000 max_fails=3 fail_timeout=10s;
    }

    # Zona pembatasan request berdasarkan IP.
    limit_req_zone $binary_remote_addr
        zone=origin_limit:10m rate=5000r/s;

    server {
        listen 8080;
        server_name _;

        # Penanda instance Nginx yang melayani (untuk demo failover).
        add_header X-Nginx-Node $hostname always;

        location = /health {
            proxy_pass http://flask_backend/health;
        }

        location / {
            limit_req zone=origin_limit burst=1000 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503;

            proxy_pass http://flask_backend;
        }
    }
}
