
services:
  varnish:
    image: varnish:7.3
    ports:
      - "80:80"
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    command:
      - varnishd
      - -F
      - -f
      - /etc/varnish/default.vcl
      - -a
      - :80
      - -s
      - malloc,128m
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - news-network
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - news-network
    mem_limit: 128m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: ./app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - news-network
    mem_limit: 512m
    cpus: 1.00
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    networks:
      - news-network
    mem_limit: 192m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  news-network:
    name: news-network
    driver: bridge
